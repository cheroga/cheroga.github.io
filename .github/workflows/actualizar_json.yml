name: Actualizar Canales JSON

on:
  schedule:
    # Se ejecuta cada 15 minutos de forma automática
    - cron: '*/15 * * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente desde GitHub si quieres probar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Descargar JSON fresco de InMotion
        run: |
          # Descarga el archivo y sobrescribe el local (cambia 'canales_cache.json' si usas otro nombre en GitHub)
          curl -s "https://mensajerofm.org/json/nocache_channel.json" -o canales_cache.json

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Verificar si hay cambios reales en el archivo para no hacer commits vacíos
          if git diff --exit-code canales_cache.json; then
            echo "No hay cambios en los canales."
          else
            git add canales_cache.json
            git commit -m "Automatizado: Canales actualizados desde el servidor"
            git push
          fi
