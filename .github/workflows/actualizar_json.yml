name: Play Premium  — canales (filtrado)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

concurrency:
  group: puntoplay-canales
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  canales:
    runs-on: ubuntu-latest
    steps:
      # 1. Configurar Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 2. Bajar, filtrar y guardar canales
      - name: Bajar y filtrar canales
        run: |
          python3 - <<'PY'
          import json, urllib.request

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/138.0 Safari/537.36"

          # ── Fuente 1 ──────────────────────────────────────────────────────
          SRC1    = "https://mensajerofm.org/json/nocache_channel.json"
          GRUPOS1 = {"EVENTOS PY"}

          # ── Fuente 2 ──────────────────────────────────────────────────────
          SRC2    = "https://mensajerofm.org/json/puntoplay_canales.json"
          GRUPOS2 = {"⚽🇵🇾 LANCE, SOLO EVENTOS EN VIVO"}

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              return json.loads(urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "replace"))

          def filtrar(data, grupos, etiqueta):
              resultado = [g for g in data if isinstance(g, dict) and g.get("name") in grupos]
              print(f"\n📦 [{etiqueta}]")
              print(f"   Grupos guardados: {len(resultado)}")
              for g in resultado:
                  print(f"   · {g['name']} — {len(g.get('samples', []))} canales")
              encontrados = {g["name"] for g in resultado}
              faltantes   = grupos - encontrados
              if faltantes:
                  print(f"   ⚠️  No encontrados: {faltantes}")
                  print("   Grupos disponibles:")
                  for g in data:
                      if isinstance(g, dict) and "name" in g:
                          print(f"     · {g['name']}")
              return resultado

          data1 = fetch(SRC1)
          data2 = fetch(SRC2)

          filtrado1 = filtrar(data1, GRUPOS1, "nocache_channel.json")
          filtrado2 = filtrar(data2, GRUPOS2, "puntoplay_canales.json")

          # ── Unir ambas listas en un solo array ────────────────────────────
          final = filtrado1 + filtrado2

          with open("canales.json", "w", encoding="utf-8") as f:
              json.dump(final, f, ensure_ascii=False, indent=2)

          print(f"\n✅ Total grupos en canales.json: {len(final)}")
          PY

      # 3. Publicar en la rama "puntoplay" (force push — solo la última versión)
      - name: Publicar en rama puntoplay
        run: |
          set -e
          mkdir -p /tmp/pub && cp canales.json /tmp/pub/canales.json
          cd /tmp/pub
          git init -q
          git remote add origin "https://cheroga:${{ secrets.PAT_TOKEN }}@github.com/cheroga/cheroga.github.io.git"
          git checkout -q -b puntoplay
          git add canales.json
          git -c user.name="tapego-bot" -c user.email="bot@users.noreply.github.com" \
            commit -q -m "canales \$(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force --set-upstream origin puntoplay
          echo "✅ Publicado"
