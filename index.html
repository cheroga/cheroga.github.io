<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTBOL 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #fff; font-family: Arial, sans-serif; }
        h1 { text-align: center; padding: 20px 20px 10px 20px; color: #f90; font-size: 1.4em; }
        #player-section { position: sticky; top: 0; background: #0f0f0f; padding: 10px; z-index: 100; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
        #now-playing { text-align: center; padding: 8px; color: #f90; font-size: 1em; }
        video { width: 100%; max-width: 900px; display: block; margin: 0 auto; border-radius: 10px; background: #000; }
        #container { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px 10px 40px 10px; }
        .canal-btn { background: #1e1e1e; border: 1px solid #333; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
        .canal-btn:hover { background: #f90; color: #000; }
        .canal-btn.activo { background: #f90; color: #000; outline: 2px solid #fff; }
        .canal-btn img { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; }
        .categoria { width: 100%; padding: 15px 0 4px; color: #aaa; font-size: 0.85em; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

    <h1>FUTBOL 2026 - EN VIVO</h1>

    <div id="player-section">
        <div id="now-playing">Selecciona un canal</div>
        <video id="video" controls autoplay muted></video>
    </div>

    <div id="container">Cargando canales...</div>

<script>
    const JSON_URL = "https://raw.githubusercontent.com/cheroga/cheroga.github.io/refs/heads/master/canales_cache.json";
    let currentCanal = null;
    let retryTimeout = null;
    let activeBtn = null; // Referencia al botón activo actual

    shaka.polyfill.installAll();
    const video = document.getElementById("video");
    const player = new shaka.Player(video);

    // ESCUCHADOR DE ERRORES DE SHAKA
    player.addEventListener("error", async (e) => {
        console.error("Shaka error detectado:", e.detail);

        // Errores de red (Categoría 1) o de formato (Categoría 3)
        if (e.detail && (e.detail.category === 1 || e.detail.category === 3)) {
            console.warn("Intentando recuperar de forma nativa...");
            try {
                await player.retry();
            } catch (retryError) {
                console.error("Fallo retry() nativo, programando reintento forzado...");

                if (retryTimeout) clearTimeout(retryTimeout);

                if (currentCanal) {
                    retryTimeout = setTimeout(() => {
                        console.log("Ejecutando reintento forzado para:", currentCanal.name);
                        playChannel(currentCanal, activeBtn);
                    }, 3000);
                }
            }
        }
    });

    // FIX #1 + #2: Capturar canal en el momento del evento y usar seekable para live
    video.addEventListener("waiting", () => {
        const canalAlEsperar = currentCanal;
        setTimeout(() => {
            if (currentCanal === canalAlEsperar && !video.paused && player.isLive() && video.readyState < 3) {
                console.warn("Forzando sincronización en vivo por congelamiento...");
                const seekable = video.seekable;
                if (seekable.length > 0) {
                    video.currentTime = seekable.end(seekable.length - 1) - 1;
                }
            }
        }, 5000);
    });

    async function playChannel(canal, btnElement) {
        // Cancelar cualquier reintento pendiente del canal anterior
        if (retryTimeout) {
            clearTimeout(retryTimeout);
            retryTimeout = null;
        }

        // FIX #9: Marcar botón activo visualmente
        if (activeBtn) activeBtn.classList.remove("activo");
        if (btnElement) {
            btnElement.classList.add("activo");
            activeBtn = btnElement;
        }

        currentCanal = canal;
        document.getElementById("now-playing").textContent = "▶️ " + canal.name;

        try {
            await player.unload();
        } catch (e) {
            console.log("Aviso al descargar player:", e);
        }

        // FIX #3: Resetear configuración antes de aplicar la del nuevo canal
        player.resetConfiguration();
        player.getNetworkingEngine().clearAllRequestFilters();

        if (canal.headers) {
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                if (canal.headers.Origin) request.headers["Origin"] = canal.headers.Origin;
                if (canal.headers.Referer) request.headers["Referer"] = canal.headers.Referer;
                if (canal.headers["User-Agent"]) request.headers["User-Agent"] = canal.headers["User-Agent"];
            });
        }

        let drmConfig = {};
        if (canal.drm_license_uri && canal.type === "CLEARKEY") {
            try {
                const url = new URL(canal.drm_license_uri);
                const keyId = url.searchParams.get("keyid");
                const key = url.searchParams.get("key");

                if (keyId && key) {
                    drmConfig = { clearKeys: { [keyId]: key } };
                } else {
                    drmConfig = { servers: { "org.w3.clearkey": canal.drm_license_uri } };
                }
            } catch (e) {
                drmConfig = { servers: { "org.w3.clearkey": canal.drm_license_uri } };
            }
        }

        player.configure({
            drm: drmConfig,
            streaming: {
                retryParameters: {
                    maxAttempts: 3,
                    baseDelay: 1000,
                    backoffFactor: 2
                },
                bufferingGoal: 12,
                rebufferingGoal: 4,
                stallThreshold: 3
            },
            manifest: {
                retryParameters: {
                    maxAttempts: 3,
                    baseDelay: 1000,
                    backoffFactor: 2
                }
            }
        });

        try {
            await player.load(canal.url);
            document.getElementById("player-section").scrollIntoView({ behavior: 'smooth' });
            // Resetear contador de reintentos al cargar exitosamente
            canal._retries = 0;
        } catch (e) {
            console.error("Error al cargar canal:", e);

            if (currentCanal === canal) {
                // FIX #8: Limitar reintentos para evitar loop infinito
                canal._retries = (canal._retries || 0) + 1;

                if (canal._retries <= 3) {
                    document.getElementById("now-playing").textContent =
                        `❌ Reintentando (${canal._retries}/3): ` + canal.name;
                    retryTimeout = setTimeout(() => playChannel(canal, activeBtn), 4000);
                } else {
                    document.getElementById("now-playing").textContent =
                        "❌ Canal no disponible: " + canal.name;
                    canal._retries = 0;
                    // Quitar estilo activo si el canal falló definitivamente
                    if (activeBtn) activeBtn.classList.remove("activo");
                    activeBtn = null;
                }
            }
        }
    }

    async function loadChannels() {
        // FIX #7: Fetch con timeout de 8 segundos mediante AbortController
        const controller = new AbortController();
        const fetchTimeout = setTimeout(() => controller.abort(), 8000);

        try {
            const res = await fetch(JSON_URL, { signal: controller.signal });
            clearTimeout(fetchTimeout);

            if (!res.ok) throw new Error(`Código: \${res.status}`);
            const data = await res.json();
            const container = document.getElementById("container");
            container.innerHTML = "";

            if (!Array.isArray(data)) throw new Error("Formato inválido.");

            data.forEach(categoria => {
                const catLabel = document.createElement("div");
                catLabel.className = "categoria";
                catLabel.textContent = "📌 " + categoria.name;
                container.appendChild(catLabel);

                if (categoria.samples && Array.isArray(categoria.samples)) {
                    categoria.samples.forEach(canal => {
                        const btn = document.createElement("button");
                        btn.className = "canal-btn";

                        // FIX #4 + #5: src vacío evitado, alt siempre presente
                        const img = document.createElement("img");
                        img.alt = canal.name;
                        if (canal.icono) {
                            img.src = canal.icono;
                            img.onerror = () => img.style.display = "none";
                        } else {
                            img.style.display = "none";
                        }

                        btn.appendChild(img);
                        btn.appendChild(document.createTextNode(canal.name));
                        btn.onclick = () => playChannel(canal, btn);
                        container.appendChild(btn);
                    });
                }
            });
        } catch (e) {
            clearTimeout(fetchTimeout);
            const msg = e.name === "AbortError"
                ? "Tiempo de espera agotado al cargar canales."
                : "Error cargando canales: " + e.message;
            document.getElementById("container").textContent = msg;
        }
    }

    loadChannels();

</script>
</body>
</html>
