<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTBOL 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* -- HEADER -- */
        #header {
            background: #161616;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #f90;
            flex-shrink: 0;
        }
        #header h1 {
            color: #f90;
            font-size: 1.1em;
            flex: 1;
            text-align: center;
        }

        /* -- LAYOUT PRINCIPAL -- */
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* -- PANEL IZQUIERDO: REPRODUCTOR -- */
        #player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
            overflow: hidden;
            position: relative;
        }

        #now-playing {
            padding: 8px 14px;
            color: #f90;
            font-size: 0.95em;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
        }
        #now-playing-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }

        /* -- SPINNER DE CARGA -- */
        #spinner {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        #spinner.visible { display: flex; }
        .spin-ring {
            width: 52px; height: 52px;
            border: 5px solid #333;
            border-top-color: #f90;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* -- WEBVIEW OVERLAY -- */
        #webview-overlay {
            display: none;
            position: absolute;
            inset: 36px 0 0 0;   /* debajo del now-playing */
            z-index: 20;
            background: #0f0f0f;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 24px;
        }
        #webview-overlay.visible { display: flex; }
        #webview-overlay .wv-icon { font-size: 3em; }
        #webview-overlay .wv-title { color: #f90; font-size: 1.1em; font-weight: bold; }
        #webview-overlay .wv-desc { color: #888; font-size: 0.85em; max-width: 320px; line-height: 1.5; }
        #webview-btn {
            padding: 10px 24px;
            background: #f90;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s;
        }
        #webview-btn:hover { background: #ffaa22; }

        #video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* -- PANEL DERECHO: LISTA DE CANALES -- */
        #sidebar {
            width: 280px;
            min-width: 220px;
            max-width: 320px;
            background: #161616;
            border-left: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        #search-box {
            padding: 10px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        #search-input {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #fff;
            font-size: 0.85em;
            outline: none;
        }
        #search-input:focus { border-color: #f90; }
        #search-input::placeholder { color: #555; }

        /* Contador de canales */
        #channel-count {
            padding: 5px 12px;
            font-size: 0.72em;
            color: #555;
            background: #1a1a1a;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        #channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0 20px 0;
        }

        /* Scrollbar */
        #channel-list::-webkit-scrollbar { width: 5px; }
        #channel-list::-webkit-scrollbar-track { background: #161616; }
        #channel-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        #channel-list::-webkit-scrollbar-thumb:hover { background: #f90; }

        .categoria {
            padding: 10px 12px 4px 12px;
            color: #f90;
            font-size: 0.72em;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.05em;
            border-top: 1px solid #222;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .categoria:first-child { border-top: none; margin-top: 0; }
        .cat-count {
            background: #2a2a2a;
            color: #888;
            font-size: 0.9em;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: normal;
            letter-spacing: 0;
        }

        .canal-btn {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #1e1e1e;
            color: #ddd;
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            text-align: left;
            transition: background 0.15s;
        }
        .canal-btn:hover:not(:disabled) { background: #222; color: #fff; }
        .canal-btn.activo {
            background: #2a1f00;
            color: #f90;
            border-left: 3px solid #f90;
        }
        /* WEBVIEW deshabilitado */
        .canal-btn.webview {
            opacity: 0.55;
            cursor: default;
        }
        .canal-btn img {
            width: 30px; height: 30px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
            background: #111;
        }
        /* Fallback: inicial del canal */
        .canal-btn .img-fallback {
            width: 30px; height: 30px;
            border-radius: 4px;
            flex-shrink: 0;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            font-weight: bold;
            color: #f90;
            text-transform: uppercase;
        }
        .canal-nombre {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* Badges */
        .badge {
            font-size: 0.65em;
            padding: 1px 5px;
            border-radius: 4px;
            flex-shrink: 0;
            font-weight: bold;
            letter-spacing: 0.03em;
        }
        .badge-clearkey { background: #1a2a1a; color: #4c4; border: 1px solid #2a4a2a; }
        .badge-webview  { background: #2a2a1a; color: #aa8; border: 1px solid #3a3a2a; }
        .badge-dash     { background: #1a1a2a; color: #88c; border: 1px solid #2a2a4a; }

        /* -- RESPONSIVE -- */
        @media (max-width: 640px) {
            body { overflow: auto; }
            #main { flex-direction: column; overflow: visible; }
            #sidebar {
                width: 100%; max-width: 100%;
                border-left: none;
                border-top: 2px solid #2a2a2a;
                height: 40dvh;
            }
            #video-wrapper { min-height: 200px; }
        }
    </style>
</head>
<body>

<div id="header">
    <h1>? FUTBOL 2026 — EN VIVO</h1>
</div>

<div id="main">

    <!-- REPRODUCTOR -->
    <div id="player-panel">
        <div id="now-playing">
            <span id="now-playing-text">Seleccioná un canal</span>
        </div>

        <!-- Spinner de buffering -->
        <div id="spinner"><div class="spin-ring"></div></div>

        <!-- Overlay para canales WEBVIEW -->
        <div id="webview-overlay">
            <div class="wv-icon">??</div>
            <div class="wv-title" id="wv-canal-nombre"></div>
            <div class="wv-desc">Este canal solo está disponible como página web y no puede reproducirse en el player integrado.</div>
            <button id="webview-btn" onclick="abrirWebview()">Abrir en nueva pestaña ?</button>
        </div>

        <div id="video-wrapper">
            <video id="video" controls autoplay muted playsinline></video>
        </div>
    </div>

    <!-- LISTA DE CANALES -->
    <div id="sidebar">
        <div id="search-box">
            <input id="search-input" type="search" placeholder="?? Buscar canal..." autocomplete="off" />
        </div>
        <div id="channel-count">Cargando...</div>
        <div id="channel-list">Cargando canales...</div>
    </div>

</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/cheroga/cheroga.github.io/refs/heads/puntoplay/canales.json";

// -- Estado global ----------------------------------------------------------
let currentCanal     = null;
let currentWebview   = null;
let retryTimeout     = null;
let activeBtn        = null;
let consecutiveFails = 0;
let allData          = [];

// -- Shaka setup ------------------------------------------------------------
shaka.polyfill.installAll();
const video  = document.getElementById("video");
const spinner = document.getElementById("spinner");
let player   = new shaka.Player();
player.attach(video);

// -- Helpers de UI ----------------------------------------------------------
function setNowPlaying(text) {
    document.getElementById("now-playing-text").textContent = text;
}

function showSpinner(v) {
    spinner.classList.toggle("visible", v);
}

function showWebviewOverlay(canal) {
    document.getElementById("wv-canal-nombre").textContent = canal.name;
    currentWebview = canal.url;
    document.getElementById("webview-overlay").classList.add("visible");
    video.style.display = "none";
}

function hideWebviewOverlay() {
    document.getElementById("webview-overlay").classList.remove("visible");
    video.style.display = "block";
    currentWebview = null;
}

function abrirWebview() {
    if (currentWebview) window.open(currentWebview, "_blank");
}

// -- Eventos de buffering ---------------------------------------------------
video.addEventListener("waiting",  () => showSpinner(true));
video.addEventListener("playing",  () => showSpinner(false));
video.addEventListener("canplay",  () => showSpinner(false));
video.addEventListener("error",    () => showSpinner(false));

// Reconexión en vivo al congelar
video.addEventListener("waiting", () => {
    const snap = currentCanal;
    setTimeout(() => {
        if (currentCanal === snap && !video.paused && video.readyState < 3) {
            const s = video.seekable;
            if (s.length > 0) video.currentTime = s.end(s.length - 1) - 1;
        }
    }, 5000);
});

// -- Shaka error handler ----------------------------------------------------
function attachShakaErrorHandler(p) {
    p.addEventListener("error", async (e) => {
        console.error("Shaka error:", e.detail);
        showSpinner(false);
        if (e.detail && (e.detail.category === 1 || e.detail.category === 3)) {
            try { await p.retry(); }
            catch {
                if (retryTimeout) clearTimeout(retryTimeout);
                if (currentCanal) retryTimeout = setTimeout(() => playChannel(currentCanal, activeBtn), 3000);
            }
        }
    });
}
attachShakaErrorHandler(player);

// -- Reset del player -------------------------------------------------------
async function resetPlayer() {
    try { await player.destroy(); } catch {}
    player = new shaka.Player();
    player.attach(video);
    attachShakaErrorHandler(player);
    consecutiveFails = 0;
}

// -- Detección Safari -------------------------------------------------------
const isSafari     = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const canNativeHLS = video.canPlayType("application/vnd.apple.mpegurl") !== "";

// -- REPRODUCCIÓN PRINCIPAL -------------------------------------------------
async function playChannel(canal, btnElement) {
    if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }

    // Marcar botón activo
    if (activeBtn) activeBtn.classList.remove("activo");
    if (btnElement) { btnElement.classList.add("activo"); activeBtn = btnElement; }
    currentCanal = canal;

    // -- WEBVIEW: no reproducible --
    if (!canal.playable || canal.type === "WEBVIEW") {
        showWebviewOverlay(canal);
        setNowPlaying("?? " + canal.name);
        showSpinner(false);
        return;
    }

    hideWebviewOverlay();
    setNowPlaying("? " + canal.name);
    showSpinner(true);

    const isHLS      = canal.type === "HLS";
    const isClearKey = canal.type === "CLEARKEY";
    const hasHeaders = canal.headers && Object.keys(canal.headers).length > 0;

    // Safari nativo solo si es HLS puro sin headers y sin DRM
    const useNative = canNativeHLS && isHLS && !hasHeaders && !isClearKey;

    if (useNative) {
        try { await player.unload(); } catch {}
        video.src = canal.url;
        try {
            await video.play();
            setNowPlaying("?? " + canal.name);
            canal._retries   = 0;
            consecutiveFails = 0;
        } catch (e) {
            console.warn("Native play error:", e);
        }
        return;
    }

    // -- Shaka: DASH / HLS con headers / CLEARKEY --
    if (consecutiveFails >= 2) await resetPlayer();

    try { await player.unload(); } catch {}
    player.resetConfiguration();
    player.getNetworkingEngine().clearAllRequestFilters();

    // Aplicar headers si existen
    if (hasHeaders) {
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            const h = canal.headers;
            const allowed = ["Origin","Referer","User-Agent","user_uuid","x-aws-server-site-by"];
            allowed.forEach(k => { if (h[k]) request.headers[k] = h[k]; });
        });
    }

    // Configurar ClearKey desde drm_clearkey (ya resuelto en build)
    let drmConfig = {};
    if (isClearKey && canal.drm_clearkey) {
        const { keyId, key } = canal.drm_clearkey;
        drmConfig = { clearKeys: { [keyId]: key } };
    }

    player.configure({
        drm: drmConfig,
        streaming: {
            retryParameters: { maxAttempts: 3, baseDelay: 1000, backoffFactor: 2 },
            bufferingGoal:   12,
            rebufferingGoal: 4,
            stallThreshold:  3
        },
        manifest: {
            retryParameters: { maxAttempts: 3, baseDelay: 1000, backoffFactor: 2 }
        }
    });

    try {
        await player.load(canal.url);
        setNowPlaying("?? " + canal.name);
        canal._retries   = 0;
        consecutiveFails = 0;
        showSpinner(false);
    } catch (e) {
        console.error("Error al cargar canal:", e);
        showSpinner(false);
        consecutiveFails++;
        if (currentCanal === canal) {
            canal._retries = (canal._retries || 0) + 1;
            if (canal._retries <= 3) {
                setNowPlaying(`? Reintentando (${canal._retries}/3): ${canal.name}`);
                retryTimeout = setTimeout(() => playChannel(canal, activeBtn), 4000);
            } else {
                setNowPlaying("? Canal no disponible: " + canal.name);
                canal._retries = 0;
                if (activeBtn) activeBtn.classList.remove("activo");
                activeBtn = null;
            }
        }
    }
}

// -- Crear elemento de imagen con fallback ----------------------------------
function crearIcono(canal) {
    if (canal.icono) {
        const img = document.createElement("img");
        img.alt = canal.name;
        img.src = canal.icono;
        img.onerror = () => {
            const fb = crearFallbackIcono(canal.name);
            img.replaceWith(fb);
        };
        return img;
    }
    return crearFallbackIcono(canal.name);
}

function crearFallbackIcono(nombre) {
    const div = document.createElement("div");
    div.className = "img-fallback";
    div.textContent = nombre.trim().charAt(0) || "?";
    return div;
}

// -- Renderizado de la lista ------------------------------------------------
function renderList(data, filter = "") {
    const list = document.getElementById("channel-list");
    list.innerHTML = "";
    const q = filter.toLowerCase().trim();
    let totalVisible = 0;

    data.forEach(categoria => {
        const canales = (categoria.samples || []).filter(c =>
            !q || c.name.toLowerCase().includes(q)
        );
        if (!canales.length) return;
        totalVisible += canales.length;

        // Encabezado de categoría con contador
        const catLabel = document.createElement("div");
        catLabel.className = "categoria";
        const catNombre = document.createElement("span");
        catNombre.textContent = "?? " + categoria.name;
        const catCount = document.createElement("span");
        catCount.className = "cat-count";
        catCount.textContent = canales.length;
        catLabel.appendChild(catNombre);
        catLabel.appendChild(catCount);
        list.appendChild(catLabel);

        canales.forEach(canal => {
            const btn = document.createElement("button");
            btn.className = "canal-btn";
            if (canal.type === "WEBVIEW") btn.classList.add("webview");
            if (activeBtn && currentCanal === canal) btn.classList.add("activo");

            // Icono con fallback
            btn.appendChild(crearIcono(canal));

            // Nombre
            const nombre = document.createElement("span");
            nombre.className = "canal-nombre";
            nombre.textContent = canal.name;
            btn.appendChild(nombre);

            // Badge según tipo
            if (canal.type === "CLEARKEY") {
                const b = document.createElement("span");
                b.className = "badge badge-clearkey";
                b.textContent = "??";
                btn.appendChild(b);
            } else if (canal.type === "WEBVIEW") {
                const b = document.createElement("span");
                b.className = "badge badge-webview";
                b.textContent = "WEB";
                btn.appendChild(b);
            } else if (canal.type === "DASH") {
                const b = document.createElement("span");
                b.className = "badge badge-dash";
                b.textContent = "MPD";
                btn.appendChild(b);
            }

            btn.onclick = () => playChannel(canal, btn);
            list.appendChild(btn);
        });
    });

    // Contador global
    document.getElementById("channel-count").textContent =
        q ? `${totalVisible} resultado${totalVisible !== 1 ? "s" : ""} para "${filter}"`
          : `${totalVisible} canal${totalVisible !== 1 ? "es" : ""}`;

    if (!list.children.length) {
        list.textContent = q ? `Sin resultados para "${filter}"` : "Sin canales.";
    }
}

// -- Carga inicial ----------------------------------------------------------
async function loadChannels() {
    const controller   = new AbortController();
    const fetchTimeout = setTimeout(() => controller.abort(), 8000);
    try {
        const res = await fetch(`${JSON_URL}?nocache=${Date.now()}`, { signal: controller.signal });
        clearTimeout(fetchTimeout);
        if (!res.ok) throw new Error(`Código: ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Formato inválido.");
        allData = data;
        renderList(allData);
    } catch (e) {
        clearTimeout(fetchTimeout);
        document.getElementById("channel-list").textContent =
            e.name === "AbortError"
                ? "Tiempo de espera agotado."
                : "Error cargando canales: " + e.message;
        document.getElementById("channel-count").textContent = "";
    }
}

// -- Buscador ---------------------------------------------------------------
document.getElementById("search-input").addEventListener("input", e => {
    renderList(allData, e.target.value);
});

// -- Atajos de teclado ------------------------------------------------------
document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
        e.preventDefault();
        video.paused ? video.play() : video.pause();
    }
    if (e.code === "KeyF") {
        e.preventDefault();
        if (!document.fullscreenElement) {
            document.getElementById("player-panel").requestFullscreen?.();
        } else {
            document.exitFullscreen?.();
        }
    }
    if (e.code === "KeyM") {
        e.preventDefault();
        video.muted = !video.muted;
    }
});

loadChannels();
</script>
</body>
</html>
